
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/png" href="kushneupane.png">

<title>Projects | Kush Neupane</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    color:white;
    background-image:url("web back.png");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
    position:relative;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    z-index:-1;
}

/* HEADER */

header{
    width:100%;
    height:80px;
    display:flex;
    justify-content:flex-end;
    align-items:center;
    padding:0 30px;
    position:relative;
    z-index:1000;
}

.menu-button{
    width:54px;
    height:54px;
    border:1px solid rgba(255,255,255,.25);
    border-radius:14px;
    background:rgba(0,0,0,.55);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    cursor:pointer;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:6px;
    transition:.3s;
}

.menu-button:hover{
    background:rgba(255,255,255,.12);
    transform:scale(1.05);
}

.menu-button span{
    width:27px;
    height:3px;
    background:white;
    border-radius:5px;
    transition:.3s;
}

.menu-button.active span:nth-child(1){
    transform:translateY(9px) rotate(45deg);
}

.menu-button.active span:nth-child(2){
    opacity:0;
}

.menu-button.active span:nth-child(3){
    transform:translateY(-9px) rotate(-45deg);
}

.menu{
    position:absolute;
    top:72px;
    right:30px;
    width:245px;
    padding:10px;
    background:rgba(10,10,10,.88);
    border:1px solid rgba(255,255,255,.16);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border-radius:18px;
    box-shadow:0 15px 45px rgba(0,0,0,.55);
    opacity:0;
    visibility:hidden;
    transform:translateY(-10px) scale(.98);
    transition:.25s;
}

.menu.active{
    opacity:1;
    visibility:visible;
    transform:translateY(0) scale(1);
}

.menu a{
    display:flex;
    align-items:center;
    min-height:48px;
    color:white;
    text-decoration:none;
    padding:12px 15px;
    margin:3px 0;
    border-radius:11px;
    font-size:16px;
    transition:.25s;
}

.menu a:hover{
    background:rgba(255,255,255,.12);
    padding-left:21px;
}

.menu .divider{
    height:1px;
    background:rgba(255,255,255,.12);
    margin:8px 5px;
}

/* MAIN */

main{
    min-height:calc(100vh - 80px);
    padding:40px 25px 60px;
}

.page-title{
    text-align:center;
    margin-bottom:30px;
}

.page-title h1{
    font-size:clamp(36px,6vw,58px);
    margin-bottom:12px;
}

.page-title p{
    font-size:18px;
    color:rgba(255,255,255,.85);
}

/* GALLERY */

.gallery-section{
    width:min(1100px,100%);
    margin:auto;
}

.gallery-heading{
    margin-bottom:18px;
}

.gallery-heading h2{
    font-size:23px;
}

/* FILTERS */

.filter-bar{
    display:flex;
    gap:9px;
    flex-wrap:wrap;
    margin-bottom:25px;
}

.filter-button{
    padding:10px 19px;
    border:1px solid rgba(255,255,255,.2);
    border-radius:25px;
    color:white;
    background:rgba(0,0,0,.38);
    cursor:pointer;
    font-size:14px;
    transition:.25s;
}

.filter-button:hover{
    background:rgba(255,255,255,.13);
}

.filter-button.active{
    background:rgba(130,35,190,.55);
    border-color:rgba(210,130,255,.8);
    box-shadow:0 0 13px rgba(160,40,255,.2);
}

/* EDITORIAL MEDIA GRID */

#mediaGrid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    align-items:start;
    gap:22px;
}

.media-card{
    min-width:0;
    overflow:hidden;
    background:rgba(0,0,0,.42);
    border:1px solid rgba(255,255,255,.14);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    border-radius:17px;
    box-shadow:0 15px 40px rgba(0,0,0,.28);
    transition:transform .25s,border-color .25s;
}

.media-card:hover{
    transform:translateY(-4px);
    border-color:rgba(190,80,255,.5);
}

.media-preview{
    display:block;
    width:100%;
    height:auto;
    max-height:460px;
    object-fit:contain;
    background:rgba(0,0,0,.65);
}

.media-click{
    position:relative;
    display:block;
    width:100%;
    cursor:pointer;
    border:0;
    padding:0;
    background:rgba(0,0,0,.65);
    color:white;
    text-align:left;
}

.media-click img{
    display:block;
    width:100%;
    height:auto;
    max-height:460px;
    object-fit:contain;
}

.media-placeholder{
    width:100%;
    min-height:190px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:12px;
    background:rgba(0,0,0,.65);
    color:rgba(255,255,255,.75);
}

.play-button{
    width:54px;
    height:54px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding-left:4px;
    border:1px solid rgba(255,255,255,.65);
    border-radius:50%;
    background:rgba(120,30,180,.55);
    font-size:22px;
}

.media-info{
    padding:17px;
}

.media-info h3{
    font-size:19px;
    margin-bottom:9px;
    overflow-wrap:anywhere;
}

.media-info p{
    color:rgba(255,255,255,.78);
    line-height:1.55;
    font-size:14px;
    overflow-wrap:anywhere;
    white-space:pre-wrap;
}

.media-category{
    margin-top:10px;
    color:rgba(255,255,255,.58);
    font-size:12px;
}

.media-details{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
    margin-top:14px;
    font-size:12px;
    color:rgba(255,255,255,.58);
}

.media-type-label{
    color:#dfb5ff;
    border:1px solid rgba(190,80,255,.35);
    border-radius:20px;
    padding:5px 9px;
    background:rgba(120,30,180,.18);
}

.empty-state{
    grid-column:1/-1;
    text-align:center;
    padding:50px 20px;
    background:rgba(0,0,0,.38);
    border:1px solid rgba(255,255,255,.14);
    border-radius:20px;
    color:rgba(255,255,255,.8);
}

/* FULLSCREEN VIEWER */

#mediaModal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.96);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:9999;
    padding:65px 25px 25px;
}

#mediaModal.active{
    display:flex;
}

#modalLayout{
    width:min(1200px,100%);
    height:100%;
    display:grid;
    grid-template-columns:minmax(0,1fr) 290px;
    gap:20px;
    align-items:center;
}

#modalContent{
    min-width:0;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

#modalContent img,
#modalContent video{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
    border-radius:10px;
}

#modalContent iframe{
    width:100%;
    height:min(75vh,700px);
    border:0;
    border-radius:12px;
}

.modal-close{
    position:absolute;
    top:15px;
    right:20px;
    width:46px;
    height:46px;
    border:1px solid rgba(255,255,255,.3);
    border-radius:50%;
    background:rgba(0,0,0,.6);
    color:white;
    font-size:29px;
    cursor:pointer;
    z-index:10001;
}

.modal-info{
    max-height:100%;
    overflow-y:auto;
    padding:20px;
    border:1px solid rgba(255,255,255,.14);
    border-radius:16px;
    background:rgba(20,20,20,.8);
}

.modal-info h2{
    font-size:22px;
    margin-bottom:12px;
    overflow-wrap:anywhere;
}

.modal-info p{
    color:rgba(255,255,255,.8);
    line-height:1.6;
    font-size:14px;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
}

.modal-date{
    margin-top:15px;
    font-size:12px;
    color:rgba(255,255,255,.5);
}

.modal-actions{
    display:flex;
    flex-wrap:wrap;
    gap:9px;
    margin-top:22px;
}

.modal-action{
    padding:10px 14px;
    border:1px solid rgba(190,80,255,.5);
    border-radius:9px;
    background:rgba(110,25,160,.3);
    color:white;
    cursor:pointer;
}

.modal-action:hover{
    background:rgba(145,35,210,.5);
}

.modal-navigation{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.modal-navigation button{
    flex:1;
    padding:10px;
    border:1px solid rgba(255,255,255,.2);
    border-radius:9px;
    background:rgba(255,255,255,.08);
    color:white;
    cursor:pointer;
}

.modal-navigation button:disabled{
    opacity:.35;
    cursor:not-allowed;
}

#shareStatus{
    min-height:18px;
    margin-top:12px;
    font-size:12px;
    color:#d8b0ff;
}

/* RESPONSIVE */

@media(max-width:850px){

    #mediaGrid{
        grid-template-columns:repeat(2,minmax(0,1fr));
    }

    #modalLayout{
        grid-template-columns:minmax(0,1fr) 250px;
    }

}

@media(max-width:600px){

    header{
        padding:0 15px;
    }

    .menu{
        right:15px;
        width:min(245px,calc(100vw - 30px));
    }

    main{
        padding:30px 15px 50px;
    }

    .page-title p{
        font-size:16px;
    }

    #mediaGrid{
        grid-template-columns:1fr;
        gap:18px;
    }

    .filter-bar{
        gap:7px;
    }

    .filter-button{
        padding:9px 14px;
        font-size:13px;
    }

    #mediaModal{
        padding:65px 12px 12px;
        overflow-y:auto;
        align-items:flex-start;
    }

    #modalLayout{
        height:auto;
        min-height:100%;
        display:flex;
        flex-direction:column;
        gap:15px;
    }

    #modalContent{
        width:100%;
        min-height:45vh;
        max-height:65vh;
        flex:none;
    }

    #modalContent img,
    #modalContent video{
        max-width:100%;
        max-height:60vh;
    }

    #modalContent iframe{
        height:45vh;
    }

    .modal-info{
        width:100%;
        max-height:none;
    }

}

</style>
</head>

<header>

<button
    class="menu-button"
    id="menuButton"
    onclick="toggleMenu()"
    aria-label="Open menu"
>
    <span></span>
    <span></span>
    <span></span>
</button>

<nav class="menu" id="menu">

<a href="index.html" onclick="closeMenu()">Home</a>

<a href="projects.html" onclick="closeMenu()">Projects</a>

</header>

<main>

<div class="page-title">

<h1>Projects</h1>

<p>Explore projects and uploaded work.</p>

</div>

<section class="gallery-section">

    <div class="gallery-heading">
        <h2>Explore Media</h2>
    </div>

    <div class="filter-bar" id="filterBar">

        <button class="filter-button active" data-filter="all">All</button>

        <button class="filter-button" data-filter="shorts">Shorts</button>

        <button class="filter-button" data-filter="videos">Videos</button>

<!-- FULLSCREEN MEDIA VIEWER -->

    <div id="modalContent"></div>

    <aside class="modal-info">

        <h2 id="modalTitle"></h2>

            <button class="modal-action" id="shareButton">

            </button>

            <button class="modal-action" id="downloadButton">

            </button>

        </div>

            <button id="nextButton">Next</button>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="firebase-config.js"></script>

<script>

/* MENU */

const menuButton = document.getElementById("menuButton");

const menu = document.getElementById("menu");

function toggleMenu(){

    menu.classList.toggle("active");

    menuButton.classList.toggle("active");

}

function closeMenu(){

    menu.classList.remove("active");

    menuButton.classList.remove("active");

}

document.addEventListener("click",function(event){

    if(
        !menu.contains(event.target) &&
        !menuButton.contains(event.target)
    ){

        closeMenu();

    }

});

/* FIREBASE */

let db = null;

const firebaseReady =
    window.firebaseConfig &&
    window.firebaseConfig.apiKey &&
    !String(window.firebaseConfig.apiKey).startsWith("PASTE_");

if(firebaseReady){

    try{

        if(!firebase.apps.length){

            firebase.initializeApp(window.firebaseConfig);

        }

        db = firebase.firestore();

    }catch(error){

        console.error("Firebase initialization error:",error);

    }

}

/* GLOBAL MEDIA DATA */

let allMedia = [];

let visibleMedia = [];

let activeFilter = "all";

let currentViewerIndex = 0;

let currentViewerMedia = null;

/* HTML SECURITY */

function escapeHTML(value){

    return String(value || "").replace(/[&<>"']/g,function(character){

        return {

            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"

        }[character];

    });

}

/* YOUTUBE */

function getYouTubeId(url){

    if(!url) return "";

    try{

        const parsed = new URL(url);

        if(parsed.hostname.includes("youtube.com")){

            const videoId = parsed.searchParams.get("v");

            if(videoId) return videoId;

            if(parsed.pathname.startsWith("/shorts/")){

                return parsed.pathname.split("/shorts/")[1].split("/")[0];

            }

            if(parsed.pathname.startsWith("/embed/")){

                return parsed.pathname.split("/embed/")[1].split("/")[0];

            }

        }

        if(
            parsed.hostname === "youtu.be" ||
            parsed.hostname.endsWith(".youtu.be")
        ){

            return parsed.pathname.substring(1).split("/")[0];

        }

    }catch(error){

        return "";

    }

    return "";

}

function getYouTubeEmbed(url){

    const id = getYouTubeId(url);

    return id
        ? "https://www.youtube.com/embed/" + encodeURIComponent(id)
        : "";

}

function isYouTubeShort(url){

    return /youtube\.com\/shorts\//i.test(String(url || ""));

}

/* DATE */

function getDateValue(value){

    if(!value) return 0;

    if(value.seconds){

        return value.seconds * 1000;

    }

    if(typeof value.toDate === "function"){

        return value.toDate().getTime();

    }

    if(typeof value === "number"){

        return value;

    }

    const parsed = new Date(value).getTime();

    return Number.isNaN(parsed) ? 0 : parsed;

}

function formatDate(value){

    const time = getDateValue(value);

    if(!time) return "";

    return new Date(time).toLocaleDateString(undefined,{

        year:"numeric",
        month:"short",
        day:"numeric"

    });

}

/* NORMALIZE OLD AND NEW MEDIA RECORDS */

function normalizeMedia(data,id){

    let type = String(
        data.type ||
        data.mediaType ||
        data.format ||
        ""
    ).toLowerCase();

    const url = data.url || data.mediaUrl || "";

    const youtubeId = getYouTubeId(url);

    if(
        type === "image" ||
        type === "photo" ||
        type === "photos"
    ){

        type = "photo";

    }else if(
        type === "youtube" ||
        youtubeId
    ){

        type = "youtube";

    }else if(
        type === "video" ||
        type === "videos" ||
        type === "short" ||
        type === "shorts"
    ){

        type = "video";

    }

    return {

        ...data,

        id:id,

        type:type,

        url:url,

        thumbnailUrl:
            data.thumbnailUrl ||
            data.thumbnail ||
            ""

    };

}

/* ASPECT RATIO */

function getAspectRatio(item){

    if(item.aspectRatio){

        const ratio = Number(item.aspectRatio);

        if(ratio > 0) return ratio;

    }

    const width = Number(item.width || item.videoWidth || 0);

    const height = Number(item.height || item.videoHeight || 0);

    if(width > 0 && height > 0){

        return width / height;

    }

    return item._detectedRatio || 0;

}

/* MEDIA CLASSIFICATION */

function getMediaKind(item){

    if(item.type === "photo"){

        return "photos";

    }

    if(item.type === "short" || item.type === "shorts"){

        return "shorts";

    }

    if(item.type === "youtube" && isYouTubeShort(item.url)){

        return "shorts";

    }

    const ratio = getAspectRatio(item);

    if(ratio && ratio < 0.85){

        return "shorts";

    }

    return "videos";

}

function getTypeLabel(item){

    const kind = getMediaKind(item);

    if(kind === "photos") return "Photo";

    if(kind === "shorts") return "Short";

    return "Video";

}

/* DETECT VIDEO DIMENSIONS */

function detectVideoDimensions(item){

    if(!item.url) return;

    if(item.type === "photo") return;

    if(getYouTubeId(item.url)) return;

    if(getAspectRatio(item)) return;

    const video = document.createElement("video");

    video.preload = "metadata";

    video.onloadedmetadata = function(){

        if(video.videoWidth && video.videoHeight){

            item._detectedRatio =
                video.videoWidth / video.videoHeight;

            renderMedia();

        }

        video.removeAttribute("src");

        video.load();

    };

    video.onerror = function(){

        video.removeAttribute("src");

        video.load();

    };

    video.src = item.playbackUrl || item.url;

}

/* THUMBNAILS */

function getThumbnail(item){

    if(item.thumbnailUrl){

        return item.thumbnailUrl;

    }

    const youtubeId = getYouTubeId(item.url);

    if(youtubeId){

        return "https://img.youtube.com/vi/" +
            youtubeId +
            "/hqdefault.jpg";

    }

    if(item.type === "photo"){

        return item.url;

    }

    return "";

}

/* MEDIA FILTERS */

function getFilteredMedia(){

    if(activeFilter === "all"){

        return allMedia;

    }

    return allMedia.filter(function(item){

        return getMediaKind(item) === activeFilter;

    });

}

function updateFilterButtons(){

    document.querySelectorAll(".filter-button").forEach(function(button){

        button.classList.toggle(
            "active",
            button.dataset.filter === activeFilter
        );

    });

}

/* MEDIA CARD */

function mediaCard(item){

    const kind = getMediaKind(item);

    const thumbnail = getThumbnail(item);

    let preview = "";

    if(kind === "photos"){

        preview = `

            <button
                class="media-click"
                type="button"
                data-open-id="${escapeHTML(item.id)}"
                aria-label="Open photo"
            >

                <img
                    src="${escapeHTML(item.url)}"
                    alt="${escapeHTML(item.name || "Project photo")}"
                    loading="lazy"
                >

            </button>

        `;

    }else{

        if(thumbnail){

            preview = `

                <button
                    class="media-click"
                    type="button"
                    data-open-id="${escapeHTML(item.id)}"
                    aria-label="Play video"
                >

                    <img
                        src="${escapeHTML(thumbnail)}"
                        alt="${escapeHTML(item.name || "Video thumbnail")}"
                        loading="lazy"
                    >

                    <span class="play-button"
                        style="
                            position:absolute;
                            left:50%;
                            top:50%;
                            transform:translate(-50%,-50%);
                        "
                    >▶</span>

                </button>

            `;

        }else{

            preview = `

                <button
                    class="media-click"
                    type="button"
                    data-open-id="${escapeHTML(item.id)}"
                    aria-label="Open video"
                >

                    <div class="media-placeholder">

                        <span class="play-button">▶</span>

                        <span>Open video</span>

                    </div>

                </button>

            `;

        }

    }

    return `

        <article class="media-card">

            ${preview}

            <div class="media-info">

                <h3>
                    ${escapeHTML(item.name || "Untitled Project")}
                </h3>

                <p>
                    ${escapeHTML(item.description || "")}
                </p>

                ${
                    item.category
                    ? `<div class="media-category">${escapeHTML(item.category)}</div>`
                    : ""
                }

                <div class="media-details">

                    <span class="media-type-label">
                        ${escapeHTML(getTypeLabel(item))}
                    </span>

                    <span>
                        ${escapeHTML(formatDate(item.createdAt))}
                    </span>

                </div>

            </div>

        </article>

    `;

}

/* RENDER GALLERY */

function renderMedia(){

    const mediaGrid = document.getElementById("mediaGrid");

    visibleMedia = getFilteredMedia();

    if(!visibleMedia.length){

        mediaGrid.innerHTML = `

            <div class="empty-state">

                No ${
                    activeFilter === "all"
                    ? "projects"
                    : activeFilter
                } found.

            </div>

        `;

        return;

    }

    mediaGrid.innerHTML = visibleMedia.map(mediaCard).join("");

}

/* FILTER EVENTS */

document.getElementById("filterBar").addEventListener("click",function(event){

    const button = event.target.closest(".filter-button");

    if(!button) return;

    activeFilter = button.dataset.filter;

    updateFilterButtons();

    renderMedia();

});

/* VIEWER */

const mediaModal = document.getElementById("mediaModal");

const modalContent = document.getElementById("modalContent");

function openMediaModal(itemId){

    const list = getFilteredMedia();

    const index = list.findIndex(function(item){

        return item.id === itemId;

    });

    if(index < 0) return;

    currentViewerIndex = index;

    showViewerItem();

}

function showViewerItem(){

    const list = getFilteredMedia();

    if(!list.length) return;

    if(currentViewerIndex < 0){

        currentViewerIndex = 0;

    }

    if(currentViewerIndex >= list.length){

        currentViewerIndex = list.length - 1;

    }

    currentViewerMedia = list[currentViewerIndex];

    modalContent.innerHTML = "";

    const youtubeId = getYouTubeId(currentViewerMedia.url);

    if(youtubeId){

        const iframe = document.createElement("iframe");

        iframe.src =
            getYouTubeEmbed(currentViewerMedia.url) +
            "?autoplay=1";

        iframe.allow =
            "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";

        iframe.allowFullscreen = true;

        modalContent.appendChild(iframe);

    }else if(getMediaKind(currentViewerMedia) === "photos"){

        const image = document.createElement("img");

        image.src = currentViewerMedia.url;

        image.alt = currentViewerMedia.name || "Project photo";

        modalContent.appendChild(image);

    }else{

        const video = document.createElement("video");

        video.src =
            currentViewerMedia.playbackUrl ||
            currentViewerMedia.url;

        video.controls = true;

        video.autoplay = true;

        video.playsInline = true;

        modalContent.appendChild(video);

    }

    document.getElementById("modalTitle").textContent =
        currentViewerMedia.name || "Untitled Project";

    document.getElementById("modalDescription").textContent =
        currentViewerMedia.description || "No description available.";

    document.getElementById("modalDate").textContent = [

        getTypeLabel(currentViewerMedia),

        currentViewerMedia.category || "",

        formatDate(currentViewerMedia.createdAt)

    ].filter(Boolean).join(" · ");

    document.getElementById("previousButton").disabled =
        currentViewerIndex === 0;

    document.getElementById("nextButton").disabled =
        currentViewerIndex === list.length - 1;

    document.getElementById("shareStatus").textContent = "";

    document.getElementById("downloadButton").style.display =
        youtubeId ? "none" : "";

    mediaModal.classList.add("active");

    document.body.style.overflow = "hidden";

}

function closeMediaModal(){

    mediaModal.classList.remove("active");

    modalContent.innerHTML = "";

    currentViewerMedia = null;

    document.body.style.overflow = "";

}

document.getElementById("modalClose").addEventListener("click",closeMediaModal);

mediaModal.addEventListener("click",function(event){

    if(event.target === mediaModal){

        closeMediaModal();

    }

});

/* NAVIGATION */

document.getElementById("previousButton").addEventListener("click",function(){

    if(currentViewerIndex > 0){

        currentViewerIndex--;

        showViewerItem();

    }

});

document.getElementById("nextButton").addEventListener("click",function(){

    if(currentViewerIndex < getFilteredMedia().length - 1){

        currentViewerIndex++;

        showViewerItem();

    }

});

/* OPEN CARD */

document.addEventListener("click",function(event){

    const target = event.target.closest("[data-open-id]");

    if(!target) return;

    openMediaModal(target.dataset.openId);

});

/* SHARE */

function getShareURL(item){

    const url = new URL(window.location.href);

    url.searchParams.set("post",item.id);

    return url.toString();

}

document.getElementById("shareButton").addEventListener("click",async function(){

    if(!currentViewerMedia) return;

    const shareURL = getShareURL(currentViewerMedia);

    const shareData = {

        title:currentViewerMedia.name || "Project",

        text:currentViewerMedia.description || "",

        url:shareURL

    };

    try{

        if(navigator.share){

            await navigator.share(shareData);

        }else{

            await navigator.clipboard.writeText(shareURL);

            document.getElementById("shareStatus").textContent =
                "Link copied.";

        }

    }catch(error){

        if(error.name !== "AbortError"){

            try{

                await navigator.clipboard.writeText(shareURL);

                document.getElementById("shareStatus").textContent =
                    "Link copied.";

            }catch(copyError){

                document.getElementById("shareStatus").textContent =
                    "Unable to share. Please copy the page link.";

            }

        }

    }

});

/* DOWNLOAD */

document.getElementById("downloadButton").addEventListener("click",function(){

    if(!currentViewerMedia) return;

    if(getYouTubeId(currentViewerMedia.url)) return;

    const url =
        currentViewerMedia.url ||
        currentViewerMedia.playbackUrl;

    if(!url) return;

    const link = document.createElement("a");

    link.href = url;

    link.download =
        (currentViewerMedia.name || "project")
        .replace(/[^\w\- ]/g,"")
        .trim() || "project";

    link.target = "_blank";

    link.rel = "noopener";

    document.body.appendChild(link);

    link.click();

    link.remove();

});

/* KEYBOARD */

document.addEventListener("keydown",function(event){

    if(event.key === "Escape"){

        closeMediaModal();

    }

    if(!mediaModal.classList.contains("active")) return;

    if(event.key === "ArrowLeft"){

        document.getElementById("previousButton").click();

    }

    if(event.key === "ArrowRight"){

        document.getElementById("nextButton").click();

    }

});

/* LOAD PROJECTS */

async function loadProjects(){

    const mediaGrid = document.getElementById("mediaGrid");

    if(!db){

        mediaGrid.innerHTML = `

            <div class="empty-state">

                Firebase is not configured.

            </div>

        `;

        return;

    }

    try{

        const snapshot = await db
            .collection("media")
            .where("page","==","projects")
            .get();

        allMedia = snapshot.docs.map(function(doc){

            return normalizeMedia(doc.data(),doc.id);

        });

        /* NEWEST FIRST */

        allMedia.sort(function(a,b){

            return getDateValue(b.createdAt) -
                   getDateValue(a.createdAt);

        });

        renderMedia();

        /* DETECT VIDEO DIMENSIONS WHEN AVAILABLE */

        allMedia.forEach(detectVideoDimensions);

        /* OPEN A SHARED POST DIRECTLY */

        const requestedPost =
            new URLSearchParams(window.location.search).get("post");

        if(requestedPost){

            const requested = allMedia.find(function(item){

                return item.id === requestedPost;

            });

            if(requested){

                openMediaModal(requestedPost);

            }

        }

    }catch(error){

        console.error("Error loading projects:",error);

        mediaGrid.innerHTML = `

            <div class="empty-state">

                Unable to load projects right now.
                Please check your Firebase setup.

            </div>

        `;

    }

}

/* START */

loadProjects();

</script>
