
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Search | Kush Neupane</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    color:white;
    background-image:url("web back.png");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
    position:relative;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    z-index:-1;
}

/* HEADER */

header{
    width:100%;
    height:80px;
    display:flex;
    justify-content:flex-end;
    align-items:center;
    padding:0 30px;
    position:relative;
    z-index:1000;
}

.menu-button{
    width:54px;
    height:54px;
    border:1px solid rgba(255,255,255,.25);
    border-radius:14px;
    background:rgba(0,0,0,.55);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    cursor:pointer;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:6px;
    transition:.3s;
}

.menu-button:hover{
    background:rgba(255,255,255,.12);
    transform:scale(1.05);
}

.menu-button span{
    width:27px;
    height:3px;
    background:white;
    border-radius:5px;
    transition:.3s;
}

.menu-button.active span:nth-child(1){
    transform:translateY(9px) rotate(45deg);
}

.menu-button.active span:nth-child(2){
    opacity:0;
}

.menu-button.active span:nth-child(3){
    transform:translateY(-9px) rotate(-45deg);
}

.menu{
    position:absolute;
    top:72px;
    right:30px;
    width:245px;
    padding:10px;
    background:rgba(10,10,10,.88);
    border:1px solid rgba(255,255,255,.16);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border-radius:18px;
    box-shadow:0 15px 45px rgba(0,0,0,.55);
    opacity:0;
    visibility:hidden;
    transform:translateY(-10px) scale(.98);
    transition:.25s;
}

.menu.active{
    opacity:1;
    visibility:visible;
    transform:translateY(0) scale(1);
}

.menu a{
    display:flex;
    align-items:center;
    min-height:48px;
    color:white;
    text-decoration:none;
    padding:12px 15px;
    margin:3px 0;
    border-radius:11px;
    font-size:16px;
    transition:.25s;
}

.menu a:hover{
    background:rgba(255,255,255,.12);
    padding-left:21px;
}

.menu .divider{
    height:1px;
    background:rgba(255,255,255,.12);
    margin:8px 5px;
}

/* MAIN */

main{
    min-height:calc(100vh - 80px);
    padding:40px 25px 60px;
}

.search-container{
    width:min(900px,100%);
    margin:0 auto 35px;
    text-align:center;
}

.search-container h1{
    font-size:clamp(36px,6vw,58px);
    margin-bottom:25px;
}

.search-box{
    display:flex;
    gap:10px;
    width:100%;
}

.search-box input{
    flex:1;
    min-height:54px;
    padding:0 18px;
    border:none;
    outline:none;
    border-radius:14px;
    background:rgba(0,0,0,.55);
    border:1px solid rgba(255,255,255,.18);
    color:white;
    font-size:17px;
    backdrop-filter:blur(10px);
}

.search-box input::placeholder{
    color:rgba(255,255,255,.6);
}

.search-box button{
    min-width:120px;
    border:none;
    border-radius:14px;
    background:#241044;
    color:white;
    font-size:17px;
    cursor:pointer;
    transition:.25s;
}

.search-box button:hover{
    transform:translateY(-2px);
    background:#32155d;
}

/* FILTERS */

.filter-container{
    width:min(1100px,100%);
    margin:0 auto 28px;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
}

.filter-button{
    padding:11px 23px;
    border:1px solid rgba(255,255,255,.2);
    border-radius:30px;
    background:rgba(0,0,0,.45);
    color:white;
    cursor:pointer;
    font-size:15px;
    transition:.25s;
}

.filter-button:hover{
    background:rgba(255,255,255,.12);
}

.filter-button.active{
    background:#32155d;
    border-color:#9b70e8;
}

/* RESULT INFORMATION */

#resultCount{
    width:min(1100px,100%);
    margin:0 auto 20px;
    color:rgba(255,255,255,.75);
    font-size:14px;
}

/* MEDIA GRID */

#searchResults{
    width:min(1100px,100%);
    margin:auto;
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:22px;
    align-items:start;
}

.media-card{
    overflow:hidden;
    background:rgba(0,0,0,.38);
    border:1px solid rgba(255,255,255,.14);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    border-radius:18px;
    box-shadow:0 20px 60px rgba(0,0,0,.35);
    transition:transform .25s,border-color .25s;
    min-width:0;
}

.media-card:hover{
    transform:translateY(-4px);
    border-color:rgba(190,150,255,.55);
}

.media-preview{
    display:block;
    width:100%;
    max-height:350px;
    object-fit:contain;
    background:#080808;
    cursor:pointer;
}

.media-preview.image-preview{
    height:auto;
    max-height:400px;
}

.media-preview.video-preview{
    aspect-ratio:16/9;
    object-fit:cover;
}

.media-preview.short-preview{
    aspect-ratio:9/16;
    max-height:420px;
    object-fit:contain;
}

.preview-wrapper{
    position:relative;
    background:#080808;
    overflow:hidden;
}

.preview-label{
    position:absolute;
    top:10px;
    left:10px;
    padding:6px 10px;
    background:rgba(0,0,0,.75);
    border:1px solid rgba(255,255,255,.2);
    border-radius:20px;
    font-size:12px;
    pointer-events:none;
}

.media-info{
    padding:17px;
}

.media-info h3{
    font-size:19px;
    margin-bottom:9px;
    overflow-wrap:anywhere;
}

.media-info p{
    color:rgba(255,255,255,.82);
    line-height:1.55;
    font-size:14px;
    overflow-wrap:anywhere;
}

.media-category{
    display:inline-block;
    margin-top:12px;
    padding:5px 10px;
    border-radius:20px;
    background:rgba(120,75,190,.25);
    border:1px solid rgba(180,140,255,.25);
    font-size:12px;
    color:#e2d1ff;
}

.empty-state{
    grid-column:1/-1;
    text-align:center;
    padding:50px 20px;
    background:rgba(0,0,0,.38);
    border:1px solid rgba(255,255,255,.14);
    border-radius:20px;
    color:rgba(255,255,255,.8);
}

/* FULL SCREEN VIEWER */

#mediaViewer{
    display:none;
    position:fixed;
    inset:0;
    z-index:5000;
    background:rgba(0,0,0,.96);
    align-items:center;
    justify-content:center;
    padding:25px;
}

#mediaViewer.active{
    display:flex;
}

#viewerClose{
    position:absolute;
    top:18px;
    right:22px;
    width:48px;
    height:48px;
    border:1px solid rgba(255,255,255,.3);
    border-radius:50%;
    background:rgba(0,0,0,.7);
    color:white;
    font-size:29px;
    cursor:pointer;
    z-index:5005;
}

.viewer-layout{
    width:min(1200px,100%);
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:15px;
    padding:35px 0 10px;
}

#viewerContent{
    width:100%;
    flex:1;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
}

#viewerContent img,
#viewerContent video{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
    border-radius:10px;
}

#viewerContent iframe{
    width:min(1000px,95vw);
    height:min(65vh,600px);
    border:0;
    border-radius:12px;
}

.viewer-details{
    width:min(850px,100%);
    max-height:25vh;
    overflow:auto;
    text-align:center;
    padding:10px 15px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.12);
    border-radius:14px;
}

#viewerTitle{
    font-size:21px;
    margin-bottom:7px;
    overflow-wrap:anywhere;
}

#viewerDescription{
    color:rgba(255,255,255,.8);
    line-height:1.5;
    font-size:14px;
    overflow-wrap:anywhere;
}

#viewerMeta{
    color:rgba(255,255,255,.55);
    font-size:12px;
    margin-top:9px;
}

.viewer-actions{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:9px;
}

.viewer-actions button{
    min-width:85px;
    padding:9px 15px;
    border:1px solid rgba(255,255,255,.2);
    border-radius:20px;
    background:rgba(255,255,255,.1);
    color:white;
    cursor:pointer;
    transition:.2s;
}

.viewer-actions button:hover{
    background:rgba(120,75,190,.5);
}

.viewer-actions button:disabled{
    opacity:.35;
    cursor:not-allowed;
}

/* RESPONSIVE */

@media(max-width:850px){

    #searchResults{
        grid-template-columns:repeat(2,minmax(0,1fr));
    }

}

@media(max-width:600px){

    header{
        padding:0 15px;
    }

    .menu{
        right:15px;
        width:min(245px,calc(100vw - 30px));
    }

    main{
        padding:30px 15px 50px;
    }

    .search-box{
        flex-direction:column;
    }

    .search-box button{
        min-height:52px;
    }

    #searchResults{
        grid-template-columns:1fr;
        gap:18px;
    }

    .filter-container{
        justify-content:flex-start;
        overflow-x:auto;
        flex-wrap:nowrap;
        padding:4px 0 10px;
    }

    .filter-button{
        white-space:nowrap;
    }

    #mediaViewer{
        padding:12px;
    }

    .viewer-layout{
        padding-top:55px;
    }

    #viewerContent iframe{
        height:50vh;
    }

    .viewer-details{
        max-height:23vh;
    }

}

</style>
</head>

<body>

<header>

<button
    class="menu-button"
    id="menuButton"
    onclick="toggleMenu()"
    aria-label="Open menu"
>
    <span></span>
    <span></span>
    <span></span>
</button>

<nav class="menu" id="menu">

<a href="index.html" onclick="closeMenu()">Home</a>

<a href="projects.html" onclick="closeMenu()">Projects</a>

</header>

<main>

    type="text"

    placeholder="Search uploaded media..."

>

</section>

<!-- MEDIA FILTERS -->

<div class="filter-container" id="filterContainer">

All

<!-- FULL SCREEN VIEWER -->

<button id="viewerClose" onclick="closeViewer()">×</button>

<div class="viewer-layout">

    <div id="viewerContent"></div>

    <div class="viewer-details">

        <h2 id="viewerTitle"></h2>

        <button id="previousButton" onclick="navigateViewer(-1)">

        </button>

        <button onclick="shareCurrentMedia()">

        </button>

        </button>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="firebase-config.js"></script>

<script>

let db=null;

const firebaseReady =
    window.firebaseConfig &&
    window.firebaseConfig.apiKey &&
    !String(window.firebaseConfig.apiKey).startsWith("PASTE_");

if(firebaseReady){

    try{

        if(!firebase.apps.length){
            firebase.initializeApp(window.firebaseConfig);
        }

        db=firebase.firestore();

    }catch(error){

        console.error(error);

    }
}

/* MENU */

const menuButton=document.getElementById("menuButton");
const menu=document.getElementById("menu");

function toggleMenu(){

    menu.classList.toggle("active");
    menuButton.classList.toggle("active");

}

function closeMenu(){

    menu.classList.remove("active");
    menuButton.classList.remove("active");

}

document.addEventListener("click",function(event){

    if(
        !menu.contains(event.target) &&
        !menuButton.contains(event.target)
    ){

        closeMenu();

    }

});

/* HTML ESCAPING */

function escapeHTML(value){

    return String(value || "").replace(
        /[&<>"']/g,
        function(character){

            return {
                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"
            }[character];

        }
    );

}

/* MEDIA DATA */

let allMatches=[];
let filteredMatches=[];
let activeFilter="all";
let currentViewerIndex=-1;
let previousScrollPosition=0;

const results=document.getElementById("searchResults");
const resultCount=document.getElementById("resultCount");

function getMediaURL(data){

    return (
        data.playbackUrl ||
        data.mediaUrl ||
        data.url ||
        ""
    );

}

function getThumbnail(data){

    return (
        data.thumbnailUrl ||
        data.thumbnail ||
        ""
    );

}

function getMediaType(data){

    const type=String(
        data.type ||
        data.mediaType ||
        ""
    ).toLowerCase();

    if(
        type==="photo" ||
        type==="image" ||
        type==="picture"
    ){

        return "photo";

    }

    if(
        type==="youtube" ||
        data.youtubeId ||
        /youtube\.com|youtu\.be/i.test(getMediaURL(data))
    ){

        return "youtube";

    }

    return "video";

}

/* YOUTUBE */

function getYouTubeId(url){

    if(!url){
        return "";
    }

    const patterns=[
        /youtube\.com\/watch\?v=([^&]+)/i,
        /youtu\.be\/([^?&]+)/i,
        /youtube\.com\/embed\/([^?&]+)/i,
        /youtube\.com\/shorts\/([^?&]+)/i
    ];

    for(const pattern of patterns){

        const match=url.match(pattern);

        if(match){
            return match[1];
        }

    }

    return "";

}

function isYouTubeShort(data){

    const url=getMediaURL(data);

    return (
        /youtube\.com\/shorts\//i.test(url) ||
        data.format==="shorts" ||
        data.categoryType==="shorts"
    );

}

/* DATE */

function getDateValue(data){

    const date=data.createdAt || data.date;

    if(!date){
        return 0;
    }

    if(typeof date.toDate==="function"){
        return date.toDate().getTime();
    }

    if(date.seconds){
        return date.seconds*1000;
    }

    const parsed=new Date(date).getTime();

    return Number.isNaN(parsed) ? 0 : parsed;

}

function formatDate(data){

    const timestamp=getDateValue(data);

    if(!timestamp){
        return "Date unavailable";
    }

    return new Date(timestamp).toLocaleDateString(
        undefined,
        {
            year:"numeric",
            month:"short",
            day:"numeric"
        }
    );

}

/* MEDIA CLASSIFICATION */

function getMediaKind(data){

    const type=getMediaType(data);

    if(type==="photo"){
        return "photos";
    }

    if(type==="youtube"){

        return isYouTubeShort(data)
            ? "shorts"
            : "videos";

    }

    if(
        data.format==="shorts" ||
        data.categoryType==="shorts" ||
        data.mediaCategory==="shorts"
    ){

        return "shorts";

    }

    if(
        data.format==="video" ||
        data.categoryType==="video"
    ){

        return "videos";

    }

    return data.detectedKind || "videos";

}

/* DETECT VIDEO DIMENSIONS */

function detectVideoFormat(data){

    if(
        getMediaType(data)!=="video" ||
        data.format ||
        data.categoryType
    ){

        return Promise.resolve(data);

    }

    const url=getMediaURL(data);

    if(!url){
        return Promise.resolve(data);
    }

    return new Promise(function(resolve){

        const video=document.createElement("video");

        video.preload="metadata";
        video.muted=true;

        video.onloadedmetadata=function(){

            if(video.videoHeight>video.videoWidth){

                data.detectedKind="shorts";

            }else{

                data.detectedKind="videos";

            }

            video.removeAttribute("src");
            video.load();

            resolve(data);

        };

        video.onerror=function(){

            data.detectedKind="videos";

            resolve(data);

        };

        video.src=url;

    });

}

/* CREATE CARD */

function createCard(data,index){

    const name=escapeHTML(data.name || "Untitled");
    const description=escapeHTML(data.description || "");

    const category=escapeHTML(
        data.category ||
        data.categoryName ||
        ""
    );

    const kind=getMediaKind(data);

    const url=getMediaURL(data);
    const thumbnail=getThumbnail(data);

    const type=getMediaType(data);

    let preview="";

    if(type==="photo"){

        preview=`
            <img
                class="media-preview image-preview"
                src="${escapeHTML(url)}"
                alt="${name}"
                loading="lazy"
                onclick="openViewer(${index})"
            >
        `;

    }else{

        let previewContent="";

        if(type==="youtube"){

            const youtubeId=
                data.youtubeId ||
                getYouTubeId(url);

            const youtubeThumbnail=
                thumbnail ||
                (
                    youtubeId
                    ? "https://img.youtube.com/vi/" +
                      encodeURIComponent(youtubeId) +
                      "/hqdefault.jpg"
                    : ""
                );

            previewContent=youtubeThumbnail
                ? `
                    <img
                        class="media-preview ${
                            kind==="shorts"
                            ? "short-preview"
                            : "video-preview"
                        }"
                        src="${escapeHTML(youtubeThumbnail)}"
                        alt="${name}"
                        loading="lazy"
                        onclick="openViewer(${index})"
                    >
                `
                : `
                    <div class="media-preview video-preview"
                         onclick="openViewer(${index})">
                         Video
                    </div>
                `;

        }else if(thumbnail){

            previewContent=`
                <img
                    class="media-preview ${
                        kind==="shorts"
                        ? "short-preview"
                        : "video-preview"
                    }"
                    src="${escapeHTML(thumbnail)}"
                    alt="${name}"
                    loading="lazy"
                    onclick="openViewer(${index})"
                >
            `;

        }else{

            previewContent=`
                <video
                    class="media-preview ${
                        kind==="shorts"
                        ? "short-preview"
                        : "video-preview"
                    }"
                    src="${escapeHTML(url)}"
                    preload="metadata"
                    muted
                    playsinline
                    onclick="openViewer(${index})"
                ></video>
            `;

        }

        preview=`
            <div class="preview-wrapper">

                ${previewContent}

                <span class="preview-label">
                    ${kind==="shorts" ? "Shorts" : "Video"}
                </span>

            </div>
        `;

    }

    return `
        <article class="media-card">

            ${preview}

            <div class="media-info">

                <h3>${name}</h3>

                <p>${description}</p>

                ${
                    category
                    ? `<span class="media-category">${category}</span>`
                    : ""
                }

            </div>

        </article>
    `;

}

/* FILTERS */

document
    .querySelectorAll(".filter-button")
    .forEach(function(button){

        button.addEventListener("click",function(){

            document
                .querySelectorAll(".filter-button")
                .forEach(function(item){

                    item.classList.remove("active");

                });

            button.classList.add("active");

            activeFilter=button.dataset.filter;

            applyFilter();

        });

    });

function applyFilter(){

    if(activeFilter==="all"){

        filteredMatches=allMatches.slice();

    }else{

        filteredMatches=allMatches.filter(function(data){

            return getMediaKind(data)===activeFilter;

        });

    }

    renderResults();

}

function renderResults(){

    if(!filteredMatches.length){

        results.innerHTML=`
            <div class="empty-state">
                No matching media found in this category.
            </div>
        `;

        resultCount.textContent="0 results";

        return;

    }

    resultCount.textContent=
        filteredMatches.length +
        (
            filteredMatches.length===1
            ? " result"
            : " results"
        );

    results.innerHTML=filteredMatches
        .map(function(data,index){

            return createCard(data,index);

        })
        .join("");

}

/* SEARCH */

async function performSearch(){

    const input=document
        .getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();

    if(!input){

        allMatches=[];
        filteredMatches=[];

        results.innerHTML=`
            <div class="empty-state">
                Enter something to search.
            </div>
        `;

        resultCount.textContent="";

        return;

    }

    if(!db){

        results.innerHTML=`
            <div class="empty-state">
                Firebase is not configured.
            </div>
        `;

        resultCount.textContent="";

        return;

    }

    results.innerHTML=`
        <div class="empty-state">
            Searching...
        </div>
    `;

    resultCount.textContent="";

    try{

        const snapshot=
            await db.collection("media").get();

        let matches=snapshot.docs
            .map(function(doc){

                return {
                    id:doc.id,
                    ...doc.data()
                };

            })
            .filter(function(data){

                const name=String(
                    data.name ||
                    data.title ||
                    ""
                ).toLowerCase();

                const description=String(
                    data.description || ""
                ).toLowerCase();

                const page=String(
                    data.page || ""
                ).toLowerCase();

                const category=String(
                    data.category ||
                    data.categoryName ||
                    ""
                ).toLowerCase();

                return(
                    name.includes(input) ||
                    description.includes(input) ||
                    page.includes(input) ||
                    category.includes(input)
                );

            })
            .sort(function(a,b){

                return getDateValue(b)-getDateValue(a);

            });

        allMatches=matches;

        /*
         * Detect portrait/landscape video formats.
         * YouTube Shorts are identified from their URLs.
         */

        await Promise.all(
            allMatches.map(detectVideoFormat)
        );

        applyFilter();

    }catch(error){

        console.error(error);

        results.innerHTML=`
            <div class="empty-state">
                Could not search uploads.
                Check your Firebase setup.
            </div>
        `;

        resultCount.textContent="";

    }

}

document
    .getElementById("searchInput")
    .addEventListener("keydown",function(event){

        if(event.key==="Enter"){
            performSearch();
        }

    });

/* VIEWER */

function openViewer(index){

    if(index<0 || index>=filteredMatches.length){
        return;
    }

    currentViewerIndex=index;

    previousScrollPosition=window.scrollY;

    const data=filteredMatches[index];

    const viewer=document.getElementById("mediaViewer");
    const content=document.getElementById("viewerContent");

    content.innerHTML="";

    const url=getMediaURL(data);
    const type=getMediaType(data);

    const youtubeId=
        data.youtubeId ||
        getYouTubeId(url);

    if(type==="youtube" && youtubeId){

        const iframe=document.createElement("iframe");

        iframe.src=
            "https://www.youtube.com/embed/" +
            encodeURIComponent(youtubeId) +
            "?autoplay=1";

        iframe.allow=
            "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";

        iframe.allowFullscreen=true;

        content.appendChild(iframe);

    }else if(type==="photo"){

        const image=document.createElement("img");

        image.src=url;
        image.alt=data.name || "Photo";

        content.appendChild(image);

    }else{

        const video=document.createElement("video");

        video.src=url;
        video.controls=true;
        video.autoplay=true;
        video.playsInline=true;

        content.appendChild(video);

    }

    document.getElementById("viewerTitle").textContent=
        data.name || "Untitled";

    document.getElementById("viewerDescription").textContent=
        data.description || "";

    const category=data.category || data.categoryName || "";

    document.getElementById("viewerMeta").textContent=
        [
            category,
            formatDate(data),
            getMediaKind(data)==="shorts"
                ? "Shorts"
                : getMediaKind(data)==="photos"
                    ? "Photo"
                    : "Video"
        ].filter(Boolean).join(" • ");

    document.getElementById("previousButton").disabled=
        index===0;

    document.getElementById("nextButton").disabled=
        index===filteredMatches.length-1;

    document.getElementById("downloadButton").style.display=
        type==="youtube" ? "none" : "inline-block";

    viewer.classList.add("active");

    document.body.style.overflow="hidden";

}

function closeViewer(){

    const viewer=document.getElementById("mediaViewer");
    const content=document.getElementById("viewerContent");

    viewer.classList.remove("active");

    content.innerHTML="";

    document.body.style.overflow="";

    currentViewerIndex=-1;

    window.scrollTo(0,previousScrollPosition);

}

function navigateViewer(direction){

    const nextIndex=currentViewerIndex+direction;

    if(
        nextIndex>=0 &&
        nextIndex<filteredMatches.length
    ){

        openViewer(nextIndex);

    }

}

/* SHARE */

async function shareCurrentMedia(){

    if(currentViewerIndex<0){
        return;
    }

    const data=filteredMatches[currentViewerIndex];

    const shareURL=new URL(
        window.location.href
    );

    shareURL.searchParams.set("post",data.id);

    const shareData={
        title:data.name || "Kush Neupane",
        text:data.description || "Check out this upload.",
        url:shareURL.href
    };

    try{

        if(navigator.share){

            await navigator.share(shareData);

        }else{

            await navigator.clipboard.writeText(shareURL.href);

            alert("Link copied to clipboard.");

        }

    }catch(error){

        if(error.name!=="AbortError"){

            try{

                await navigator.clipboard.writeText(shareURL.href);

                alert("Link copied to clipboard.");

            }catch(copyError){

                alert("Unable to share this media.");

            }

        }

    }

}

/* DOWNLOAD */

function downloadCurrentMedia(){

    if(currentViewerIndex<0){
        return;
    }

    const data=filteredMatches[currentViewerIndex];

    if(getMediaType(data)==="youtube"){
        return;
    }

    const url=getMediaURL(data);

    if(!url){
        return;
    }

    const link=document.createElement("a");

    link.href=url;
    link.download=data.name || "media";

    link.target="_blank";

    document.body.appendChild(link);

    link.click();

    link.remove();

}

/* CLOSE VIEWER */

document
    .getElementById("mediaViewer")
    .addEventListener("click",function(event){

        if(event.target===this){
            closeViewer();
        }

    });

document.addEventListener("keydown",function(event){

    if(event.key==="Escape"){
        closeViewer();
    }

    if(
        document.getElementById("mediaViewer").classList.contains("active")
    ){

        if(event.key==="ArrowLeft"){
            navigateViewer(-1);
        }

        if(event.key==="ArrowRight"){
            navigateViewer(1);
        }

    }

});

/* OPEN SHARED MEDIA */

async function openSharedMedia(){

    const params=new URLSearchParams(
        window.location.search
    );

    const postId=params.get("post");

    if(!postId || !db){
        return;
    }

    try{

        const doc=await db.collection("media").doc(postId).get();

        if(!doc.exists){
            return;
        }

        const data={
            id:doc.id,
            ...doc.data()
        };

        await detectVideoFormat(data);

        const existingIndex=allMatches.findIndex(function(item){

            return item.id===data.id;

        });

        if(existingIndex===-1){

            allMatches.unshift(data);

        }

        activeFilter="all";

        document
            .querySelectorAll(".filter-button")
            .forEach(function(button){

                button.classList.toggle(
                    "active",
                    button.dataset.filter==="all"
                );

            });

        applyFilter();

        const index=filteredMatches.findIndex(function(item){

            return item.id===data.id;

        });

        if(index!==-1){
            openViewer(index);
        }

    }catch(error){

        console.error("Could not open shared media:",error);

    }

}
