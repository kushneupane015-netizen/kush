
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Home | Kush Neupane</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

html{scroll-behavior:smooth;}

body{
    min-height:100vh;
    color:white;
    background-image:url("web back.png");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
    position:relative;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    z-index:-1;
}

/* HEADER */

header{
    width:100%;
    height:80px;
    display:flex;
    justify-content:flex-end;
    align-items:center;
    padding:0 30px;
    position:relative;
    z-index:1000;
}

.menu-button{
    width:54px;
    height:54px;
    border:1px solid rgba(255,255,255,.25);
    border-radius:14px;
    background:rgba(0,0,0,.55);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    cursor:pointer;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:6px;
    transition:.3s;
}

.menu-button:hover{
    background:rgba(255,255,255,.12);
    transform:scale(1.05);
}

.menu-button span{
    width:27px;
    height:3px;
    background:white;
    border-radius:5px;
    transition:.3s;
}

.menu-button.active span:nth-child(1){
    transform:translateY(9px) rotate(45deg);
}

.menu-button.active span:nth-child(2){opacity:0;}

.menu-button.active span:nth-child(3){
    transform:translateY(-9px) rotate(-45deg);
}

/* MENU */

.menu{
    position:absolute;
    top:72px;
    right:30px;
    width:245px;
    padding:10px;
    background:rgba(10,10,10,.88);
    border:1px solid rgba(255,255,255,.16);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border-radius:18px;
    box-shadow:0 15px 45px rgba(0,0,0,.55);
    opacity:0;
    visibility:hidden;
    transform:translateY(-10px) scale(.98);
    transition:.25s;
}

.menu.active{
    opacity:1;
    visibility:visible;
    transform:translateY(0) scale(1);
}

.menu a{
    display:flex;
    align-items:center;
    min-height:48px;
    color:white;
    text-decoration:none;
    padding:12px 15px;
    margin:3px 0;
    border-radius:11px;
    font-size:16px;
    transition:.25s;
}

.menu a:hover{
    background:rgba(255,255,255,.12);
    padding-left:21px;
}

.menu .divider{
    height:1px;
    background:rgba(255,255,255,.12);
    margin:8px 5px;
}

/* WELCOME BANNER */

.welcome-banner{
    width:min(1100px,calc(100% - 40px));
    margin:0 auto 10px;
    min-height:78px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
    border:1px solid rgba(190,80,255,.65);
    border-radius:18px;
    background:linear-gradient(
        90deg,
        rgba(45,0,80,.72),
        rgba(115,0,180,.42),
        rgba(45,0,80,.72)
    );
    box-shadow:
        0 0 18px rgba(160,40,255,.35),
        inset 0 0 25px rgba(160,40,255,.12);
}

.welcome-banner::before,
.welcome-banner::after{
    content:"";
    position:absolute;
    width:90px;
    height:1px;
    background:linear-gradient(
        90deg,
        transparent,
        #c45cff,
        transparent
    );
    box-shadow:0 0 10px #c45cff;
}

.welcome-banner::before{left:7%;}
.welcome-banner::after{right:7%;}

.welcome-banner-content{
    text-align:center;
    position:relative;
    z-index:1;
}

.welcome-banner h2{
    font-size:clamp(18px,3vw,30px);
    letter-spacing:5px;
    text-transform:uppercase;
    text-shadow:0 0 12px rgba(210,100,255,.9);
}

.welcome-banner p{
    margin-top:7px;
    font-size:13px;
    letter-spacing:3px;
    color:rgba(255,255,255,.8);
}

/* MAIN */

main{
    min-height:calc(100vh - 80px);
    padding:40px 25px 60px;
}

.page-title{
    text-align:center;
    margin-bottom:30px;
}

.page-title h1{
    font-size:clamp(36px,6vw,58px);
    margin-bottom:12px;
}

.page-title p{
    font-size:18px;
    color:rgba(255,255,255,.85);
}

/* FEATURED LATEST UPLOAD */

.featured-section{
    width:min(1100px,100%);
    margin:0 auto 38px;
}

.section-heading{
    font-size:23px;
    margin-bottom:16px;
}

.featured-card{
    display:grid;
    grid-template-columns:minmax(0,1.35fr) minmax(250px,1fr);
    overflow:hidden;
    border:1px solid rgba(190,80,255,.38);
    border-radius:20px;
    background:rgba(0,0,0,.48);
    backdrop-filter:blur(10px);
    box-shadow:0 18px 55px rgba(0,0,0,.3);
}

.featured-media{
    min-height:270px;
    max-height:440px;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.55);
    cursor:pointer;
    overflow:hidden;
}

.featured-media img{
    width:100%;
    height:100%;
    max-height:440px;
    object-fit:contain;
}

.featured-placeholder{
    color:rgba(255,255,255,.7);
    font-size:15px;
    text-align:center;
    padding:30px;
}

.featured-info{
    padding:28px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.featured-label{
    display:inline-block;
    width:fit-content;
    padding:7px 12px;
    border:1px solid rgba(196,92,255,.55);
    border-radius:20px;
    background:rgba(120,30,180,.22);
    color:#e2b5ff;
    font-size:12px;
    letter-spacing:1px;
    margin-bottom:16px;
}

.featured-info h2{
    font-size:clamp(22px,3vw,32px);
    margin-bottom:12px;
    overflow-wrap:anywhere;
}

.featured-info p{
    color:rgba(255,255,255,.8);
    line-height:1.65;
    overflow-wrap:anywhere;
}

.featured-meta{
    margin-top:17px;
    font-size:13px;
    color:rgba(255,255,255,.55);
}

.featured-open{
    margin-top:22px;
    width:fit-content;
    padding:11px 19px;
    border:1px solid rgba(196,92,255,.65);
    border-radius:10px;
    background:rgba(115,0,180,.3);
    color:white;
    cursor:pointer;
    transition:.25s;
}

.featured-open:hover{
    background:rgba(145,35,210,.5);
}

/* MEDIA FILTERS */

.gallery-section{
    width:min(1100px,100%);
    margin:auto;
}

.gallery-heading{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:18px;
}

.gallery-heading h2{
    font-size:23px;
}

.filter-bar{
    display:flex;
    gap:9px;
    flex-wrap:wrap;
    margin-bottom:25px;
}

.filter-button{
    padding:10px 19px;
    border:1px solid rgba(255,255,255,.2);
    border-radius:25px;
    color:white;
    background:rgba(0,0,0,.38);
    cursor:pointer;
    font-size:14px;
    transition:.25s;
}

.filter-button:hover{
    background:rgba(255,255,255,.13);
}

.filter-button.active{
    background:rgba(130,35,190,.55);
    border-color:rgba(210,130,255,.8);
    box-shadow:0 0 13px rgba(160,40,255,.2);
}

/* EDITORIAL MEDIA GRID */

#mediaGrid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    align-items:start;
    gap:22px;
}

.media-card{
    min-width:0;
    overflow:hidden;
    background:rgba(0,0,0,.42);
    border:1px solid rgba(255,255,255,.14);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    border-radius:17px;
    box-shadow:0 15px 40px rgba(0,0,0,.28);
    transition:transform .25s,border-color .25s;
}

.media-card:hover{
    transform:translateY(-4px);
    border-color:rgba(190,80,255,.5);
}

.media-preview{
    display:block;
    width:100%;
    height:auto;
    max-height:460px;
    object-fit:contain;
    background:rgba(0,0,0,.65);
    cursor:pointer;
}

.media-placeholder{
    width:100%;
    min-height:190px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:12px;
    background:rgba(0,0,0,.65);
    color:rgba(255,255,255,.75);
    cursor:pointer;
}

.play-symbol{
    width:54px;
    height:54px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding-left:4px;
    border:1px solid rgba(255,255,255,.65);
    border-radius:50%;
    background:rgba(120,30,180,.55);
    font-size:22px;
}

.media-info{
    padding:17px;
}

.media-info h3{
    font-size:19px;
    margin-bottom:9px;
    overflow-wrap:anywhere;
}

.media-info p{
    color:rgba(255,255,255,.78);
    line-height:1.55;
    font-size:14px;
    overflow-wrap:anywhere;
    white-space:pre-wrap;
}

.media-details{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
    margin-top:14px;
    font-size:12px;
    color:rgba(255,255,255,.58);
}

.media-type-label{
    color:#dfb5ff;
    border:1px solid rgba(190,80,255,.35);
    border-radius:20px;
    padding:5px 9px;
    background:rgba(120,30,180,.18);
}

.media-category{
    margin-top:10px;
    color:rgba(255,255,255,.58);
    font-size:12px;
}

.empty-state{
    grid-column:1/-1;
    text-align:center;
    padding:50px 20px;
    background:rgba(0,0,0,.38);
    border:1px solid rgba(255,255,255,.14);
    border-radius:20px;
    color:rgba(255,255,255,.8);
}

/* FULLSCREEN VIEWER */

#mediaViewer{
    display:none;
    position:fixed;
    inset:0;
    z-index:5000;
    background:rgba(0,0,0,.96);
    align-items:center;
    justify-content:center;
    padding:65px 25px 25px;
}

#mediaViewer.active{display:flex;}

#viewerClose{
    position:absolute;
    top:15px;
    right:20px;
    width:46px;
    height:46px;
    border:1px solid rgba(255,255,255,.3);
    border-radius:50%;
    background:rgba(0,0,0,.6);
    color:white;
    font-size:29px;
    cursor:pointer;
    z-index:5002;
}

#viewerLayout{
    width:min(1200px,100%);
    height:100%;
    display:grid;
    grid-template-columns:minmax(0,1fr) 290px;
    gap:20px;
    align-items:center;
}

#viewerContent{
    min-width:0;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

#viewerContent img,
#viewerContent video{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
    border-radius:10px;
}

#viewerContent iframe{
    width:100%;
    height:min(75vh,700px);
    border:0;
    border-radius:12px;
}

.viewer-info{
    max-height:100%;
    overflow-y:auto;
    padding:20px;
    border:1px solid rgba(255,255,255,.14);
    border-radius:16px;
    background:rgba(20,20,20,.8);
}

.viewer-info h2{
    font-size:22px;
    margin-bottom:12px;
    overflow-wrap:anywhere;
}

.viewer-info p{
    color:rgba(255,255,255,.8);
    line-height:1.6;
    font-size:14px;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
}

.viewer-date{
    margin-top:15px;
    font-size:12px;
    color:rgba(255,255,255,.5);
}

.viewer-actions{
    display:flex;
    flex-wrap:wrap;
    gap:9px;
    margin-top:22px;
}

.viewer-action{
    padding:10px 14px;
    border:1px solid rgba(190,80,255,.5);
    border-radius:9px;
    background:rgba(110,25,160,.3);
    color:white;
    cursor:pointer;
}

.viewer-action:hover{
    background:rgba(145,35,210,.5);
}

.viewer-navigation{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.viewer-navigation button{
    flex:1;
    padding:10px;
    border:1px solid rgba(255,255,255,.2);
    border-radius:9px;
    background:rgba(255,255,255,.08);
    color:white;
    cursor:pointer;
}

.viewer-navigation button:disabled{
    opacity:.35;
    cursor:not-allowed;
}

#shareStatus{
    min-height:18px;
    margin-top:12px;
    font-size:12px;
    color:#d8b0ff;
}

/* RESPONSIVE */

@media(max-width:850px){
    #mediaGrid{
        grid-template-columns:repeat(2,minmax(0,1fr));
    }

    .featured-card{
        grid-template-columns:1fr;
    }

    .featured-media{
        min-height:220px;
    }

    #viewerLayout{
        grid-template-columns:minmax(0,1fr) 250px;
    }
}

@media(max-width:600px){

    header{padding:0 15px;}

    .menu{
        right:15px;
        width:min(245px,calc(100vw - 30px));
    }

    .welcome-banner{
        width:calc(100% - 30px);
        min-height:70px;
        margin-bottom:5px;
    }

    .welcome-banner h2{
        font-size:17px;
        letter-spacing:3px;
    }

    .welcome-banner p{
        font-size:10px;
        letter-spacing:2px;
    }

    .welcome-banner::before,
    .welcome-banner::after{width:35px;}

    main{padding:30px 15px 50px;}

    .page-title p{font-size:16px;}

    #mediaGrid{
        grid-template-columns:1fr;
        gap:18px;
    }

    .filter-bar{
        gap:7px;
    }

    .filter-button{
        padding:9px 14px;
        font-size:13px;
    }

    .featured-info{padding:20px;}

    #mediaViewer{
        padding:65px 12px 12px;
        overflow-y:auto;
        align-items:flex-start;
    }

    #viewerLayout{
        height:auto;
        min-height:100%;
        display:flex;
        flex-direction:column;
        gap:15px;
    }

    #viewerContent{
        width:100%;
        min-height:45vh;
        max-height:65vh;
        flex:none;
    }

    #viewerContent img,
    #viewerContent video{
        max-width:100%;
        max-height:60vh;
    }

    #viewerContent iframe{
        height:45vh;
    }

    .viewer-info{
        width:100%;
        max-height:none;
    }
}
</style>

<script>
let db = null;
let allMedia = [];
let visibleMedia = [];
let activeFilter = "all";
let currentViewerIndex = 0;
let currentViewerMedia = null;

const firebaseReady =
    window.firebaseConfig &&
    window.firebaseConfig.apiKey &&
    !String(window.firebaseConfig.apiKey).startsWith("PASTE_");

if(firebaseReady){
    try{
        if(!firebase.apps.length){
            firebase.initializeApp(window.firebaseConfig);
        }
        db = firebase.firestore();
    }catch(error){
        console.error("Firebase initialization error:",error);
    }
}

/* MENU */

const menuButton = document.getElementById("menuButton");
const menu = document.getElementById("menu");

function toggleMenu(){
    menu.classList.toggle("active");
    menuButton.classList.toggle("active");
}

function closeMenu(){
    menu.classList.remove("active");
    menuButton.classList.remove("active");
}

document.addEventListener("click",function(event){
    if(!menu.contains(event.target) && !menuButton.contains(event.target)){
        closeMenu();
    }
});

/* SAFE HTML */

function escapeHTML(value){
    return String(value || "").replace(/[&<>"']/g,function(character){
        return {
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"
        }[character];
    });
}

/* YOUTUBE */

function getYouTubeId(url){
    if(!url) return "";

    const patterns = [
        /youtube\.com\/watch\?v=([^&]+)/i,
        /youtu\.be\/([^?&]+)/i,
        /youtube\.com\/embed\/([^?&]+)/i,
        /youtube\.com\/shorts\/([^?&]+)/i
    ];

    for(const pattern of patterns){
        const match = String(url).match(pattern);
        if(match) return match[1];
    }

    return "";
}

function isYouTubeShort(url){
    return /youtube\.com\/shorts\//i.test(String(url || ""));
}

/* DATE */

function getDateValue(value){
    if(!value) return 0;

    if(value.seconds) return value.seconds * 1000;

    if(typeof value.toDate === "function"){
        return value.toDate().getTime();
    }

    if(typeof value === "number") return value;

    const parsed = new Date(value).getTime();

    return Number.isNaN(parsed) ? 0 : parsed;
}

function formatDate(value){
    const time = getDateValue(value);

    if(!time) return "";

    return new Date(time).toLocaleDateString(undefined,{
        year:"numeric",
        month:"short",
        day:"numeric"
    });
}

/* MEDIA TYPE DETECTION */

function getMediaKind(data){
    const type = String(
        data.type ||
        data.mediaType ||
        data.format ||
        ""
    ).toLowerCase();

    const url = String(data.url || "");

    if(
        type === "photo" ||
        type === "photos" ||
        type === "image"
    ){
        return "photos";
    }

    if(
        type === "short" ||
        type === "shorts"
    ){
        return "shorts";
    }

    if(
        type === "video" ||
        type === "videos"
    ){
        if(isYouTubeShort(url)) return "shorts";

        const ratio = getAspectRatio(data);

        if(ratio && ratio < 0.85) return "shorts";

        return "videos";
    }

    if(isYouTubeShort(url)) return "shorts";

    const ratio = getAspectRatio(data);

    if(ratio && ratio < 0.85) return "shorts";

    return "videos";
}

function getAspectRatio(data){
    if(data.aspectRatio){
        const ratio = Number(data.aspectRatio);
        if(ratio > 0) return ratio;
    }

    const width = Number(data.width || data.videoWidth || 0);
    const height = Number(data.height || data.videoHeight || 0);

    if(width > 0 && height > 0){
        return width / height;
    }

    return data._detectedRatio || 0;
}

/* DETECT VIDEO DIMENSIONS */

function detectVideoDimensions(item){
    if(!item.url || getYouTubeId(item.url)) return;

    if(item.type === "photo") return;

    const video = document.createElement("video");

    video.preload = "metadata";

    video.onloadedmetadata = function(){
        if(video.videoWidth && video.videoHeight){
            item._detectedRatio =
                video.videoWidth / video.videoHeight;

            renderMedia();
        }

        video.removeAttribute("src");
        video.load();
    };

    video.onerror = function(){
        video.removeAttribute("src");
        video.load();
    };

    video.src = item.playbackUrl || item.url;
}

/* MEDIA TYPE LABEL */

function getTypeLabel(item){
    const kind = getMediaKind(item);

    if(kind === "photos") return "Photo";
    if(kind === "shorts") return "Short";
    return "Video";
}

/* FEATURED MEDIA */

function getThumbnail(item){
    if(item.thumbnailUrl) return item.thumbnailUrl;

    if(getYouTubeId(item.url)){
        return "https://img.youtube.com/vi/" +
            getYouTubeId(item.url) +
            "/hqdefault.jpg";
    }

    if(getMediaKind(item) === "photos"){
        return item.url || "";
    }

    return "";
}

function renderFeatured(item){
    const section = document.getElementById("featuredSection");
    const container = document.getElementById("featuredContainer");

    if(!item){
        section.hidden = true;
        return;
    }

    section.hidden = false;

    const thumbnail = getThumbnail(item);

    container.innerHTML = `
        <article class="featured-card">

            <div
                class="featured-media"
                data-open-id="${escapeHTML(item.id)}"
                role="button"
                tabindex="0"
                aria-label="Open latest upload"
            >
                ${
                    thumbnail
                    ? `<img src="${escapeHTML(thumbnail)}" alt="${escapeHTML(item.name)}">`
                    : `<div class="featured-placeholder">Video preview<br>Open to play</div>`
                }
            </div>

            <div class="featured-info">

                <span class="featured-label">LATEST UPLOAD</span>

                <h2>${escapeHTML(item.name || "Untitled")}</h2>

                <p>${escapeHTML(item.description || "No description available.")}</p>

                <div class="featured-meta">
                    ${escapeHTML(getTypeLabel(item))}
                    ${item.category ? " · " + escapeHTML(item.category) : ""}
                    ${formatDate(item.createdAt) ? " · " + escapeHTML(formatDate(item.createdAt)) : ""}
                </div>

                <button
                    class="featured-open"
                    data-open-id="${escapeHTML(item.id)}"
                >
                    Open Content
                </button>

            </div>

        </article>
    `;
}

/* MEDIA CARDS */

function mediaCard(item){
    const kind = getMediaKind(item);
    const thumbnail = getThumbnail(item);

    let preview = "";

    if(kind === "photos"){
        preview = `
            <img
                class="media-preview"
                src="${escapeHTML(item.url)}"
                alt="${escapeHTML(item.name)}"
                loading="lazy"
            >
        `;
    }else if(thumbnail){
        preview = `
            <div class="media-placeholder">
                <img
                    class="media-preview"
                    src="${escapeHTML(thumbnail)}"
                    alt="${escapeHTML(item.name)}"
                    loading="lazy"
                >
                <div class="play-symbol">▶</div>
            </div>
        `;
    }else{
        preview = `
            <div class="media-placeholder">
                <div class="play-symbol">▶</div>
                <span>Open video</span>
            </div>
        `;
    }

    return `
        <article
            class="media-card"
            data-open-id="${escapeHTML(item.id)}"
        >

            ${preview}

            <div class="media-info">

                <h3>${escapeHTML(item.name || "Untitled")}</h3>

                <p>${escapeHTML(item.description || "")}</p>

                ${
                    item.category
                    ? `<div class="media-category">${escapeHTML(item.category)}</div>`
                    : ""
                }

                <div class="media-details">

                    <span class="media-type-label">
                        ${escapeHTML(getTypeLabel(item))}
                    </span>

                    <span>${escapeHTML(formatDate(item.createdAt))}</span>

                </div>

            </div>

        </article>
    `;
}

/* FILTERING */

function getFilteredMedia(){
    if(activeFilter === "all") return allMedia;

    return allMedia.filter(function(item){
        return getMediaKind(item) === activeFilter;
    });
}

function updateFilterButtons(){
    document.querySelectorAll(".filter-button").forEach(function(button){
        button.classList.toggle(
            "active",
            button.dataset.filter === activeFilter
        );
    });
}

function renderMedia(){
    const box = document.getElementById("mediaGrid");

    const featured = allMedia.length ? allMedia[0] : null;

    renderFeatured(featured);

    visibleMedia = getFilteredMedia();

    if(!visibleMedia.length){
        box.innerHTML = `
            <div class="empty-state">
                No ${activeFilter === "all" ? "uploads" : activeFilter} found.
            </div>
        `;
        return;
    }

    box.innerHTML = visibleMedia.map(mediaCard).join("");
}

document.getElementById("filterBar").addEventListener("click",function(event){
    const button = event.target.closest(".filter-button");

    if(!button) return;

    activeFilter = button.dataset.filter;

    updateFilterButtons();
    renderMedia();
});

/* VIEWER */

function openViewer(itemId){
    const list = getFilteredMedia();

    const index = list.findIndex(function(item){
        return item.id === itemId;
    });

    if(index < 0) return;

    currentViewerIndex = index;

    showViewerItem();
}

function showViewerItem(){
    const list = getFilteredMedia();

    if(!list.length) return;

    if(currentViewerIndex < 0) currentViewerIndex = 0;

    if(currentViewerIndex >= list.length){
        currentViewerIndex = list.length - 1;
    }

    currentViewerMedia = list[currentViewerIndex];

    const content = document.getElementById("viewerContent");

    const viewer = document.getElementById("mediaViewer");

    content.innerHTML = "";

    const youtubeId = getYouTubeId(currentViewerMedia.url);

    if(youtubeId){

        const iframe = document.createElement("iframe");

        iframe.src =
            "https://www.youtube.com/embed/" +
            encodeURIComponent(youtubeId) +
            "?autoplay=1";

        iframe.allow =
            "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";

        iframe.allowFullscreen = true;

        content.appendChild(iframe);

    }else if(getMediaKind(currentViewerMedia) === "photos"){

        const image = document.createElement("img");

        image.src = currentViewerMedia.url;

        image.alt = currentViewerMedia.name || "Photo";

        content.appendChild(image);

    }else{

        const video = document.createElement("video");

        video.src =
            currentViewerMedia.playbackUrl ||
            currentViewerMedia.url;

        video.controls = true;

        video.autoplay = true;

        video.playsInline = true;

        content.appendChild(video);

    }

    document.getElementById("viewerTitle").textContent =
        currentViewerMedia.name || "Untitled";

    document.getElementById("viewerDescription").textContent =
        currentViewerMedia.description || "No description available.";

    document.getElementById("viewerDate").textContent =
        [
            getTypeLabel(currentViewerMedia),
            currentViewerMedia.category || "",
            formatDate(currentViewerMedia.createdAt)
        ].filter(Boolean).join(" · ");

    document.getElementById("previousButton").disabled =
        currentViewerIndex === 0;

    document.getElementById("nextButton").disabled =
        currentViewerIndex === list.length - 1;

    document.getElementById("shareStatus").textContent = "";

    const downloadButton = document.getElementById("downloadButton");

    downloadButton.style.display = youtubeId ? "none" : "";

    viewer.classList.add("active");

    document.body.style.overflow = "hidden";
}

function closeViewer(){
    const viewer = document.getElementById("mediaViewer");

    const content = document.getElementById("viewerContent");

    viewer.classList.remove("active");

    content.innerHTML = "";

    currentViewerMedia = null;

    document.body.style.overflow = "";
}

document.getElementById("viewerClose").addEventListener("click",closeViewer);

document.getElementById("mediaViewer").addEventListener("click",function(event){
    if(event.target === this){
        closeViewer();
    }
});

document.getElementById("previousButton").addEventListener("click",function(){
    if(currentViewerIndex > 0){
        currentViewerIndex--;
        showViewerItem();
    }
});

document.getElementById("nextButton").addEventListener("click",function(){
    if(currentViewerIndex < getFilteredMedia().length - 1){
        currentViewerIndex++;
        showViewerItem();
    }
});

/* OPEN MEDIA FROM CARDS AND FEATURE */

document.addEventListener("click",function(event){
    const target = event.target.closest("[data-open-id]");

    if(!target) return;

    const id = target.dataset.openId;

    openViewer(id);
});

document.addEventListener("keydown",function(event){
    if(event.key === "Escape"){
        closeViewer();
    }

    if(!document.getElementById("mediaViewer").classList.contains("active")){
        return;
    }

    if(event.key === "ArrowLeft"){
        document.getElementById("previousButton").click();
    }

    if(event.key === "ArrowRight"){
        document.getElementById("nextButton").click();
    }
});

/* SHARE */

function getShareURL(item){
    const url = new URL(window.location.href);

    url.searchParams.set("post",item.id);

    return url.toString();
}

document.getElementById("shareButton").addEventListener("click",async function(){
    if(!currentViewerMedia) return;

    const shareURL = getShareURL(currentViewerMedia);

    const shareData = {
        title:currentViewerMedia.name || "Media",
        text:currentViewerMedia.description || "",
        url:shareURL
    };

    try{
        if(navigator.share){
            await navigator.share(shareData);
        }else{
            await navigator.clipboard.writeText(shareURL);

            document.getElementById("shareStatus").textContent =
                "Link copied.";
        }
    }catch(error){
        if(error.name !== "AbortError"){
            try{
                await navigator.clipboard.writeText(shareURL);

                document.getElementById("shareStatus").textContent =
                    "Link copied.";
            }catch(copyError){
                document.getElementById("shareStatus").textContent =
                    "Unable to share. Please copy the page link.";
            }
        }
    }
});

/* DOWNLOAD */

document.getElementById("downloadButton").addEventListener("click",function(){
    if(!currentViewerMedia) return;

    if(getYouTubeId(currentViewerMedia.url)){
        return;
    }

    const url =
        currentViewerMedia.url ||
        currentViewerMedia.playbackUrl;

    if(!url) return;

    const link = document.createElement("a");

    link.href = url;

    link.download =
        (currentViewerMedia.name || "media")
        .replace(/[^\w\- ]/g,"")
        .trim() || "media";

    link.target = "_blank";

    link.rel = "noopener";

    document.body.appendChild(link);

    link.click();

    link.remove();
});

/* LOAD HOME MEDIA */

async function loadMedia(page){
    const box = document.getElementById("mediaGrid");

    if(!db){
        box.innerHTML = `
            <div class="empty-state">
                Firebase is not configured.
            </div>
        `;
        return;
    }

    try{
        const snapshot = await db.collection("media")
            .where("page","==",page)
            .get();

        allMedia = snapshot.docs.map(function(doc){
            return {
                id:doc.id,
                ...doc.data()
            };
        });

        allMedia.sort(function(a,b){
            return getDateValue(b.createdAt) -
                   getDateValue(a.createdAt);
        });

        renderMedia();

        allMedia.forEach(detectVideoDimensions);

        /* Open a post directly when a valid post ID is in the URL. */

        const requestedPost =
            new URLSearchParams(window.location.search).get("post");

        if(requestedPost){
            const requested = allMedia.find(function(item){
                return item.id === requestedPost;
            });

            if(requested){
                openViewer(requestedPost);
            }
        }

    }catch(error){
        console.error("Media loading error:",error);

        box.innerHTML = `
            <div class="empty-state">
                Could not load uploads.
                Check your Firebase setup.
            </div>
        `;
    }
}

loadMedia("home");

</script>
